// proto/recipe.proto
syntax = "proto3";

message ProcessStep{
    string step_name = 1;
    double temperature = 2;
    double pressure = 3;
    double duration_sec = 4;
    string gas_type = 5;
    double gas_flow_sccm = 6;
}

message Recipe {
    string recipe_id = 1;
    string recipe_name = 2;
    string product_type = 3;
    string created_at = 4;
    string updated_at = 5;
    repeated ProcessStep steps = 6;
    map<string,string> metadata = 7;
    }